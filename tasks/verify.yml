---
# verify.yml — Post-configuration verification for the router role.
#
# Runs a series of checks to confirm the router is correctly configured
# and operational. Covers networking, DHCP/DNS, firewall, and connectivity.

################################################################################
# Network Interface Checks
################################################################################

# --- Physical LAN Interface (eth1) -------------------------------------------
# The physical interface must exist as an NM profile, have carrier (cable),
# be UP, have NO IPv4 (native VLAN unused), and have NO global IPv6.

- name: Verify LAN connection profile exists in NetworkManager
  ansible.builtin.command:
    cmd: "nmcli -t -f NAME connection show"
  register: verify_nm_connections
  changed_when: false
  failed_when: router_lan_connection_name not in verify_nm_connections.stdout

- name: Check LAN interface carrier state
  ansible.builtin.command:
    cmd: "cat /sys/class/net/{{ router_lan_interface }}/carrier"
  register: verify_lan_carrier
  changed_when: false
  failed_when: false

- name: Verify LAN interface ({{ router_lan_interface }}) is UP
  ansible.builtin.command:
    cmd: "ip link show {{ router_lan_interface }}"
  register: verify_lan_link
  changed_when: false
  failed_when: "'state UP' not in verify_lan_link.stdout"
  when: verify_lan_carrier.stdout | trim == '1'

- name: Verify LAN interface has no IPv4 address (native VLAN unused)
  ansible.builtin.command:
    cmd: "ip -4 addr show {{ router_lan_interface }}"
  register: verify_lan_no_ip
  changed_when: false
  failed_when: "'inet ' in verify_lan_no_ip.stdout"
  when: verify_lan_carrier.stdout | trim == '1'

- name: Verify IPv6 is disabled on LAN interface
  ansible.builtin.command:
    cmd: "ip -6 addr show {{ router_lan_interface }} scope global"
  register: verify_lan_no_ipv6
  changed_when: false
  failed_when: "'inet6' in verify_lan_no_ipv6.stdout"

- name: Warn if LAN interface has no carrier (no cable connected)
  ansible.builtin.debug:
    msg: >-
      WARNING: {{ router_lan_interface }} has no carrier (no cable connected).
      VLAN sub-interface IPs will be assigned automatically by NetworkManager
      once a cable is plugged in.
  when: verify_lan_carrier.stdout | trim != '1'

# --- VLAN Sub-Interfaces (eth1.10, eth1.20, eth1.30) -------------------------
# Each VLAN must have an NM profile, be UP, have the correct gateway IP, and have NO global IPv6.

- name: Verify VLAN connection profiles exist in NetworkManager
  ansible.builtin.command:
    cmd: "nmcli -t -f NAME connection show"
  register: verify_vlan_connections
  changed_when: false
  failed_when: "'vlan-' ~ (item.name | lower) not in verify_vlan_connections.stdout"
  loop: "{{ router_vlans }}"
  loop_control:
    label: "vlan-{{ item.name | lower }}"

- name: Verify VLAN sub-interfaces are UP
  ansible.builtin.command:
    cmd: "ip link show {{ item.interface }}"
  register: verify_vlan_links
  changed_when: false
  failed_when: "'state UP' not in verify_vlan_links.stdout"
  loop: "{{ router_vlans }}"
  loop_control:
    label: "{{ item.interface }} ({{ item.name }})"
  when: verify_lan_carrier.stdout | trim == '1'

- name: Verify VLAN sub-interfaces have correct IPs
  ansible.builtin.command:
    cmd: "ip -4 addr show {{ item.interface }}"
  register: verify_vlan_ips
  changed_when: false
  failed_when: "(item.gateway_ip ~ '/' ~ item.cidr) not in verify_vlan_ips.stdout"
  loop: "{{ router_vlans }}"
  loop_control:
    label: "{{ item.interface }} ({{ item.name }})"
  when: verify_lan_carrier.stdout | trim == '1'

- name: Verify IPv6 is disabled on VLAN sub-interfaces
  ansible.builtin.command:
    cmd: "ip -6 addr show {{ item.interface }} scope global"
  register: verify_vlan_no_ipv6
  changed_when: false
  failed_when: "'inet6' in verify_vlan_no_ipv6.stdout"
  loop: "{{ router_vlans }}"
  loop_control:
    label: "{{ item.interface }} ({{ item.name }})"

# --- WAN Interface (eth0) ----------------------------------------------------

- name: Verify WAN interface has an IP (DHCP from ISP modem)
  ansible.builtin.command:
    cmd: "ip -4 addr show {{ router_wan_interface }}"
  register: verify_wan_ip
  changed_when: false
  failed_when: "'inet ' not in verify_wan_ip.stdout"

# --- IP Forwarding ------------------------------------------------------------

- name: Verify IPv4 forwarding is enabled
  ansible.builtin.command:
    cmd: "sysctl -n net.ipv4.ip_forward"
  register: verify_ip_forward
  changed_when: false
  failed_when: verify_ip_forward.stdout | trim != '1'

################################################################################
# DHCP / DNS Checks
################################################################################

# --- dnsmasq service ----------------------------------------------------------

- name: Gather service facts for verification
  ansible.builtin.service_facts:

- name: Verify dnsmasq service is running
  ansible.builtin.assert:
    that: ansible_facts.services['dnsmasq.service'].state == 'running'
    fail_msg: "dnsmasq is not running"

# --- DNS (port 53) ------------------------------------------------------------

- name: Verify dnsmasq is listening on VLAN interfaces (port 53)
  ansible.builtin.command:
    cmd: "ss -ulnp"
  register: verify_dns_listen
  changed_when: false
  failed_when: "':53 ' not in verify_dns_listen.stdout"
  # dnsmasq binds DNS to the VLAN sub-interface IPs; without carrier NM never
  # assigns those IPs, so port 53 won't appear until a cable is connected.
  when: verify_lan_carrier.stdout | trim == '1'

# --- DHCP (port 67) -----------------------------------------------------------

- name: Verify dnsmasq is serving DHCP (port 67)
  ansible.builtin.command:
    cmd: "ss -ulnp"
  register: verify_dhcp_listen
  changed_when: false
  failed_when: "':67 ' not in verify_dhcp_listen.stdout"
  ignore_errors: true # DHCP only binds when eth1 has link (cable connected); can be skipped if not, just notify the user

################################################################################
# Firewall / NAT Checks
# NOTE: This does NOT check all rules because those are numerous and can be complex;
# it only verifies the most important ones.
################################################################################

# --- NAT (POSTROUTING) -------------------------------------------------------
# Checks the nat table's POSTROUTING chain for the MASQUERADE rule that
# rewrites source IPs of outbound lab traffic to the Pi's WAN IP.

- name: Verify NAT masquerade rule exists
  ansible.builtin.command:
    cmd: "iptables -t nat -L POSTROUTING -n"
  register: verify_nat
  changed_when: false
  failed_when: "'MASQUERADE' not in verify_nat.stdout"

# --- Forwarding (FORWARD chain) ----------------------------------------------
# The FORWARD chain controls traffic passing THROUGH the router (between
# interfaces). Checks: inter-VLAN ACCEPT rules exist, lab→home DROP exists.

- name: Verify FORWARD rules exist
  ansible.builtin.command:
    cmd: "iptables -L FORWARD -n"
  register: verify_forward
  changed_when: false
  failed_when: "'ACCEPT' not in verify_forward.stdout"

- name: Verify lab-to-home blocking rule exists
  ansible.builtin.command:
    cmd: "iptables -L FORWARD -n"
  register: verify_block
  changed_when: false
  failed_when: >
    router_block_lab_to_home and
    router_home_subnet.split('/')[0] not in verify_block.stdout

################################################################################
# Connectivity Checks
################################################################################

# --- WAN connectivity ---------------------------------------------------------

- name: Verify Pi can reach ISP modem (WAN gateway)
  ansible.builtin.command:
    cmd: "ping -c 2 -W 3 {{ router_home_gateway }}"
  register: verify_gateway_ping
  changed_when: false
  failed_when: verify_gateway_ping.rc != 0
  ignore_errors: true

- name: Verify Pi can reach the internet
  ansible.builtin.command:
    cmd: "ping -c 2 -W 3 8.8.8.8"
  register: verify_internet_ping
  changed_when: false
  failed_when: verify_internet_ping.rc != 0
  ignore_errors: true

# --- DNS resolution -----------------------------------------------------------

- name: Verify DNS resolution works via dnsmasq
  ansible.builtin.command:
    cmd: "nslookup google.com {{ router_vlans[0].gateway_ip }}"
  register: verify_dns_resolve
  changed_when: false
  failed_when: verify_dns_resolve.rc != 0
  ignore_errors: true

# The Pi's /etc/resolv.conf is managed by NetworkManager and points to the ISP
# modem (e.g. 192.168.2.254) — the upstream DNS from the WAN DHCP lease.
# This is CORRECT and EXPECTED for a router: the Pi itself resolves DNS via the
# ISP modem directly, while LAB DEVICES use the Pi's dnsmasq (VLAN gateway IPs)
# as their DNS server (configured via DHCP option 6 in dnsmasq.conf).
- name: Verify /etc/resolv.conf nameserver matches WAN gateway
  ansible.builtin.command:
    cmd: "grep -q '^nameserver {{ router_home_gateway }}' /etc/resolv.conf"
  register: verify_resolv_conf
  changed_when: false
  failed_when: verify_resolv_conf.rc != 0 # Return code (rc) 0 means grep found the expected nameserver; non-zero means it did not.
  ignore_errors: true

- name: Read /etc/resolv.conf for summary
  ansible.builtin.command:
    cmd: "grep '^nameserver' /etc/resolv.conf"
  register: verify_resolv_content
  changed_when: false
  ignore_errors: true

################################################################################
# Summary
################################################################################

- name: Display verification results
  ansible.builtin.debug:
    msg:
      - "==================== ROUTER VERIFICATION ===================="
      - "LAN connection ({{ router_lan_connection_name }}): {{ 'OK' if router_lan_connection_name in verify_nm_connections.stdout else 'MISSING' }}"
      - "LAN carrier: {{ 'UP' if verify_lan_carrier.stdout | trim == '1' else 'DOWN (no cable)' }}"
      - "LAN IPv4: {{ 'OK (none)' if verify_lan_no_ip is defined and 'inet ' not in (verify_lan_no_ip.stdout | default('')) else 'SKIPPED (no carrier)' if verify_lan_carrier.stdout | trim != '1' else 'UNEXPECTED IP PRESENT' }}"
      - "LAN IPv6: {{ 'OK (disabled)' if 'inet6' not in (verify_lan_no_ipv6.stdout | default('')) else 'PRESENT — should be disabled' }}"
      - "VLAN sub-interfaces: {{ router_vlans | map(attribute='interface') | join(', ') }}"
      - "VLAN profiles: {{ 'OK' if verify_vlan_connections is not failed else 'MISSING' }}"
      - "VLAN IPv6: {{ 'OK (disabled)' if verify_vlan_no_ipv6 is not failed else 'PRESENT — should be disabled' }}"
      - "WAN IP: {{ 'OK' if 'inet ' in verify_wan_ip.stdout else 'MISSING' }}"
      - "IPv4 forwarding: {{ 'ON' if verify_ip_forward.stdout | trim == '1' else 'OFF' }}"
      - "dnsmasq: {{ ansible_facts.services['dnsmasq.service'].state | default('unknown') }}"
      - "DHCP (port 67): {{ 'OK' if verify_dhcp_listen.rc == 0 else 'NOT LISTENING (expected if eth1 has no cable)' }}"
      - "NAT masquerade: {{ 'OK' if 'MASQUERADE' in verify_nat.stdout else 'MISSING' }}"
      - "Lab→home block: {{ 'OK' if router_home_subnet.split('/')[0] in verify_block.stdout else 'MISSING' }}"
      - "Gateway ping: {{ 'OK' if (verify_gateway_ping.rc | default(1)) == 0 else 'FAILED' }}"
      - "Internet ping: {{ 'OK' if (verify_internet_ping.rc | default(1)) == 0 else 'FAILED' }}"
      - "DNS resolution: {{ 'OK' if (verify_dns_resolve.rc | default(1)) == 0 else 'FAILED' }}"
      - "resolv.conf: {{ 'OK' if (verify_resolv_conf.rc | default(1)) == 0 else 'MISMATCH' }} — expected nameserver {{ router_home_gateway }} (Pi's own DNS via WAN DHCP — lab devices use dnsmasq)"
      - "============================================================="
