---
# handlers file for devhub-ansible-router
#
# Handlers are triggered by "notify" in tasks and run once at the end of the play
# (or when explicitly flushed). They ensure services are restarted/reloaded only
# when their configuration has actually changed, avoiding unnecessary restarts.

# Bring up (or restart) the WAN NetworkManager connection after its IPv6
# settings change, so the router picks up the ISP modem's Router Advertisement and
# installs an IPv6 default route without waiting for a reboot.
- name: Activate WAN connection
  ansible.builtin.command:
    cmd: "nmcli connection up {{ router_wan_connection_name }}"
  changed_when: true

# Bring up (or restart) the LAN NetworkManager connection after the profile
# is created or modified. This applies the new configuration to the interface
# immediately without waiting for a reboot.
- name: Activate LAN connection
  ansible.builtin.command:
    cmd: "nmcli connection up {{ router_lan_connection_name }}"
  changed_when: true

# Bring up VLAN sub-interface connections after they are created or modified.
- name: Activate VLAN connections
  ansible.builtin.command:
    cmd: "nmcli connection up vlan-{{ item.name | lower }}"
  loop: "{{ router_vlans }}"
  loop_control:
    label: "{{ item.interface }}"
  changed_when: true

# Restart dnsmasq when its configuration file changes.
# This applies new DHCP ranges, DNS settings, IPv6 RA settings, static leases, etc.
- name: Restart dnsmasq
  ansible.builtin.service:
    name: dnsmasq
    state: restarted

################################################################################
# nftables reload (replaces the old "Save iptables rules" handler)
################################################################################
# With iptables, rules lived in kernel memory and a separate save step
# (netfilter-persistent) had to dump them to disk so they survived a reboot —
# two operations that could silently disagree with each other.
#
# With nftables the configuration files ARE the firewall. Reloading means
# re-reading {{ router_nftables_main_config }}, which flushes and re-applies the
# complete ruleset in ONE atomic transaction: either the new ruleset becomes
# active, or the old one stays. There is no half-applied state and no separate
# save step.
#
# The ruleset is validated with `nft --check` in tasks/firewall/persist.yml
# before this handler can run, so a syntax error never reaches the kernel.
- name: Reload nftables
  ansible.builtin.command:
    cmd: "nft --file {{ router_nftables_main_config }}"
  changed_when: true
